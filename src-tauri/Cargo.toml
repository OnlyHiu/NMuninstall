[package]
name = "nmuninstall"
version = "1.0.0"
description = "Windows program manager and uninstaller"
authors = ["OnlyHiu"]
license = "MIT"
repository = "https://github.com/OnlyHiu/NMuninstall"
edition = "2021"
rust-version = "1.82"

[lib]
name = "nmuninstall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Switches the generated context from `build.devUrl` to the embedded
# `build.frontendDist`. `tauri build` sets it, but a bare
# `cargo build --release` does not — without it the binary starts, opens a
# window, and then shows "localhost refused to connect" instead of the app.
# Do not remove.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Encodes the rendered PNG into a data URL so the WebView can render it in a
# plain `<img src>` without a temp-file lifecycle on the Rust side.
base64 = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "rt", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Icon extraction: Win32 pulls the icon out of the PE resource section, then
# `image` encodes the RGBA pixels as PNG. Only the PNG *encoder* is needed —
# the pixels come from `GetDIBits`, not from a decoder — so every other codec
# and the rayon backend are left out to keep the binary small.
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
